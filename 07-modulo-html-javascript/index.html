<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Font Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/pokedex.css">

</head>
<body>
    <section class="content">
        <h1>Pokedex</h1>

        <ol class="pokedex">
            <li class="pokemon">
                <span class="number">#001</span>
                <span class="name">Bulbasaur</span>
                <div class="detail">
                    <ol class="types">
                        <li class="type">Grass</li>
                        <li class="type">Poison</li>
                    </ol>

                <img src="./assets/images/001Bulbasaur.png" alt="Bulbasaur">
                </div>
            </li>
            <li class="pokemon">
                <span class="number">#002</span>
                <span class="name">Charmander</span>
                <div class="detail">
                    <ol class="types">
                        <li class="type">Fire</li>
                    </ol>

                <img src="./assets/images/001Charmander.png" alt="Charmander">
                </div>
            </li>
            <li class="pokemon">
                <span class="number">#003</span>
                <span class="name">Squirtle</span>
                <div class="detail">
                    <ol class="types">
                        <li class="type">Water</li>
                    </ol>

                <img src="./assets/images/001Squirtle.png" alt="Squirtle">
                </div>
            </li>
            <li class="pokemon">
                <span class="number">#004</span>
                <span class="name">Pikachu</span>
                <div class="detail">
                    <ol class="types">
                        <li class="type">Electric</li>
                    </ol>

                <img src="./assets/images/001Pikachu.png" alt="Pikachu">
                </div>
            </li>




            <!-- <li>Charmander
                <img src="./assets/images/001Charmander.png" alt="Charmander">
            </li>
            <li>Squirtle
                <img src="./assets/images/001Squirtle.png" alt="Squirtle">
            </li>
            <li>Pikachu
                <img src="./assets/images/001Pikachu.png" alt="Pikachu">
            </li>    -->
        </ol>
    </section>
   
    <!-- Main JS -->
    <script src="/assets/js/main.js"></script>
        
    
</body>
</html>
